# Met à jour chaque jour le cours de l'or, de l'argent et des devises (fichier prix.json),
# utilisé par les calculateurs de zakat de Barakah Budget.
name: Cours or et argent

on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours à 6h17 UTC
  workflow_dispatch:        # lancement manuel possible depuis l'onglet Actions
  push:
    branches: [main]
    paths: [".github/workflows/cours.yml", ".github/scripts/cours.py"]

permissions:
  contents: write

concurrency:
  group: cours
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les cours du jour
        run: python3 .github/scripts/cours.py
      - name: Enregistrer prix.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prix.json
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Cours or et argent du $(date -u +%F)"
          git push
